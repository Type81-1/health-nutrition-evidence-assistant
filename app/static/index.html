  <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
  <a href="#chat-messages" class="skip-link">跳到主内容</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="食证首页"><span class="brand-mark">食</span><span>食证</span></a>
    <div class="topbar-actions">
      <a href="/wiki" class="nav-wiki-link" title="浏览证据库"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-right:4px;vertical-align:-2px;"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>证据库</a>
      <button id="new-chat-button" class="new-chat-button" type="button" title="开始新对话"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-right:4px;vertical-align:-2px;"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
      <span class="topbar-meta"><span class="status-dot"></span>证据优先</span>
    </div>
  </header>
  <main>
    <section id="intro" class="intro">
      <h1>让每一条健康建议<br>都能找到依据。</h1>
      <p class="intro-copy">面向日常饮食、血压与血脂问题的可追溯科普。先检索公开证据，再用普通人能读懂的语言回答。支持连续追问。</p>
    </section>
    <section class="chat-container" aria-label="对话区">
      <div id="chat-messages" class="chat-messages">
        <div id="chat-empty" class="chat-empty">
          <div class="empty-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/><path d="M8 11h6M11 8v6"/></svg></div>
          <p><strong>输入你的健康营养问题</strong><br>系统将检索 PubMed + Europe PMC 公开文献，用通俗语言给出有据可查的回答。你也可以连续追问，系统会结合上下文理解你的意图。</p>
        </div>
      </div>
      <div class="chat-input-panel">
        <label for="question" class="sr-only">你想了解什么？</label>
        <div class="ask-row">
          <textarea id="question" rows="2" maxlength="500" placeholder="例如：地中海饮食对心血管风险有什么证据？"></textarea>
          <button id="ask-button" type="button">获取证据</button>
        </div>
        <div class="agent-toggle-row">
          <label class="agent-toggle" title="多Agent模式：Researcher检索 → Writer撰稿 → Critic审核">
            <input type="checkbox" id="agent-mode-checkbox">
            <span class="agent-toggle-slider"></span>
            <span class="agent-toggle-label">多Agent模式</span>
          </label>
        </div>
        <div class="suggestions" aria-label="示例问题">
          <button type="button" data-question="地中海饮食对心血管风险有什么证据？">地中海饮食与心血管风险</button>
          <button type="button" data-question="限钠饮食对高血压是否真的有帮助？">限钠饮食与高血压</button>
          <button type="button" data-question="血脂偏高的人应该只靠保健品吗？">血脂偏高如何看待保健品</button>
          <button type="button" id="demo-toggle" class="demo-toggle-btn" title="打开演示模式">🎯 演示模式</button>
        </div>
        <!-- 演示面板 -->
        <div id="demo-panel" class="demo-panel" style="display:none">
          <div class="demo-panel-header">
            <span class="demo-panel-title">演示问题集（10 题 · 5 大特性）</span>
            <button id="demo-close" class="demo-close-btn">&times;</button>
          </div>
          <div class="demo-grid" id="demo-grid"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>用于健康教育和文献线索整理，不用于诊断或治疗决策。</footer>
  <script src="/static/app.js?v=20260812"></script>
</body>
</html>
